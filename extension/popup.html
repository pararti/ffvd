<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="" width="20" height="20">
    <strong>ffvd</strong>
    <span id="hostStatus" class="muted"></span>
  </header>

  <div id="hostError" class="alert" hidden></div>

  <section>
    <div class="row">
      <input id="url" type="url" data-i18n-placeholder="urlPlaceholder" spellcheck="false">
      <button id="refresh" data-i18n-title="refreshTitle">↻</button>
    </div>

    <div id="info" class="info" hidden>
      <img id="thumb" alt="">
      <div>
        <div id="title" class="title"></div>
        <div id="meta" class="muted"></div>
      </div>
    </div>
    <div id="infoState" class="muted small"></div>

    <div class="row">
      <select id="preset"></select>
      <button id="download" class="primary" data-i18n="download"></button>
    </div>
    <label class="check" id="playlistRow" hidden>
      <input id="playlist" type="checkbox"> <span data-i18n="wholePlaylist"></span>
      <span id="playlistCount" class="muted"></span>
    </label>
    <label class="check">
      <input id="cookies" type="checkbox"> <span data-i18n="useCookies"></span>
    </label>
    <div id="dlError" class="alert" hidden></div>
  </section>

  <section>
    <div class="row between">
      <strong data-i18n="downloads"></strong>
      <button id="clear" class="link" data-i18n="clearFinished"></button>
    </div>
    <ul id="jobs"></ul>
    <div id="noJobs" class="muted small" data-i18n="noJobs"></div>
  </section>

  <details>
    <summary data-i18n="settings"></summary>
    <label class="field"><span data-i18n="outdirLabel"></span>
      <input id="outdir" type="text" spellcheck="false">
    </label>
    <p class="muted small" data-i18n="outdirHint"></p>
  </details>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
